name: NewFileMenu
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing ("Sign to Run Locally"). Set DEVELOPMENT_TEAM to your
    # Apple team ID for a properly signed build.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  NewFileMenu:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: New File Menu
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NewFileMenu
    dependencies:
      - target: FinderExtension
        embed: true

  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - FinderExtension
      - Shared
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleDisplayName: New File Menu
        LSUIElement: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
          NSExtensionAttributes: {}
    entitlements:
      path: FinderExtension/FinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Finder Sync extensions must be sandboxed. This exception lets the
        # extension create files in any folder the user right-clicks in.
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NewFileMenu.FinderExtension
